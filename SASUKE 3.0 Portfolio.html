<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SASUKE 3.0 | CSE Developer Portfolio</title>
<meta name="description" content="Portfolio of SASUKE 3.0, Computer Science and Engineering student and developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4fb;--surface:#ffffff;--ink:#141433;--muted:#4d4d72;--line:#d9d7ee;
  --accent:#2f3fd8;--accent-ink:#ffffff;--spark:#0a7fb0;--red:#c4203a;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e0f26;--surface:#171942;--ink:#eeeefc;--muted:#a9aad0;--line:#2c2e63;--accent:#7ddcff;--accent-ink:#0e0f26;--spark:#7ddcff;--red:#ff6b81}
}
:root[data-theme="dark"]{--bg:#0e0f26;--surface:#171942;--ink:#eeeefc;--muted:#a9aad0;--line:#2c2e63;--accent:#7ddcff;--accent-ink:#0e0f26;--spark:#7ddcff;--red:#ff6b81}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0625rem/1.65 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:1rem;top:-4rem;background:var(--accent);color:var(--accent-ink);padding:.6rem 1rem;border-radius:6px;z-index:100}
.skip:focus{top:1rem}
.wrap{width:min(1080px,100% - 2.5rem);margin-inline:auto}
/* Navbar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:4rem}
.logo{font-family:var(--display);font-weight:800;text-decoration:none;font-size:1.15rem}
.logo span{color:var(--accent)}
.links{display:flex;gap:.25rem;list-style:none;margin:0;padding:0;align-items:center}
.links a{display:block;padding:.5rem .8rem;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500}
.links a:hover,.links a[aria-current="true"]{color:var(--ink);background:var(--surface)}
.icon-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;min-width:2.5rem;height:2.5rem;cursor:pointer;font:inherit}
.icon-btn:hover{background:var(--surface)}
#menu-btn{display:none}
@media (max-width:760px){
  #menu-btn{display:inline-block}
  .links{position:absolute;left:0;right:0;top:4rem;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem 1.25rem 1rem;display:none}
  .links.open{display:flex}
}
/* Hero */
.hero{padding:clamp(4rem,12vw,9rem) 0 clamp(3rem,8vw,6rem)}
.hero p.role{font-family:var(--display);font-weight:500;color:var(--spark);font-size:1.2rem;margin:0 0 1rem}
.hero h1{font-size:clamp(3rem,13vw,8.5rem);font-weight:800;letter-spacing:-.04em}
.hero h1 sup{font-size:.28em;color:var(--red);vertical-align:top;margin-left:.15em;letter-spacing:0}
.bolt{display:block;width:min(560px,90%);height:auto;margin:.75rem 0 1.5rem;overflow:visible}
.bolt path{stroke:var(--spark);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lead{max-width:38rem;color:var(--muted);font-size:1.2rem;margin:0 0 2rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:8px;font-weight:500;text-decoration:none;border:2px solid var(--accent);cursor:pointer;font:inherit;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--surface)}
/* Sections */
section.block{padding:clamp(3rem,7vw,5.5rem) 0;border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:2rem 4rem}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.split>h2{font-size:clamp(1.9rem,4vw,2.6rem);position:sticky;top:5.5rem;align-self:start}
@media (max-width:820px){.split>h2{position:static}}
.about p{margin:0 0 1rem;max-width:40rem}
.facts{display:flex;flex-wrap:wrap;gap:.5rem 2rem;margin:1.5rem 0 0;padding:0;list-style:none;color:var(--muted)}
.facts strong{color:var(--ink)}
/* Skills */
.skill-group+.skill-group{margin-top:1.75rem}
.skill-group h3{font-size:1.1rem;margin-bottom:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;margin:0;padding:0}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.35rem .95rem;font-weight:500;font-size:.98rem}
/* Projects */
.proj{list-style:none;margin:0;padding:0}
.proj li{padding:1.75rem 0;border-bottom:1px solid var(--line)}
.proj li:first-child{padding-top:0}
.proj h3{font-size:1.6rem;margin-bottom:.5rem}
.proj p{margin:0 0 .9rem;color:var(--muted);max-width:38rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem 1rem;color:var(--spark);font-weight:500;font-size:.95rem;margin-bottom:1rem}
.proj a.more{font-weight:500;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.proj a.more:hover{color:var(--accent)}
/* Contact */
form{display:grid;gap:1.1rem;max-width:34rem}
label{display:block;font-weight:500;margin-bottom:.3rem}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--muted);border-radius:8px;padding:.7rem .85rem}
textarea{min-height:9rem;resize:vertical}
input:focus-visible,textarea:focus-visible{outline-offset:1px}
.status{min-height:1.5rem;margin:0;color:var(--muted)}
.direct{margin:2rem 0 0;padding:0;list-style:none;display:grid;gap:.4rem}
.direct a{text-underline-offset:4px}
/* Footer */
footer{border-top:1px solid var(--line);padding:2.5rem 0 3rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:center}
.social{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;list-style:none;margin:0;padding:0}
.social a{display:inline-block;padding:.4rem 0;text-underline-offset:4px}
.social a:hover{color:var(--accent)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bolt path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div id="navbar"></div>
<main id="main"><div id="hero"></div><div id="about"></div><div id="skills"></div><div id="projects"></div><div id="contact"></div></main>
<div id="footer"></div>

<script>
/* ============ EDIT YOUR DETAILS HERE ============ */
const DATA = {
  name: "SASUKE",
  version: "3.0",
  department: "Computer Science and Engineering",
  role: "CSE student and full-stack developer",
  tagline: "I build fast, accessible web apps and enjoy turning messy problems into clean code.",
  about: [
    "I'm a Computer Science and Engineering student who likes building things end to end, from the database to the pixels on screen. [Replace with your own story.]",
    "Outside of class I compete in coding contests, contribute to small open-source projects, and learn something new every week. [Replace with your interests.]"
  ],
  facts: [["Department", "CSE"], ["Focus", "Web development"], ["Status", "Open to internships"]],
  skills: {
    "Languages": ["JavaScript", "Python", "Java", "C++", "SQL"],
    "Frontend": ["React", "HTML5", "CSS3", "Tailwind CSS"],
    "Backend and tools": ["Node.js", "Express", "MongoDB", "Git and GitHub", "Docker"]
  },
  projects: [
    {title: "Project One", desc: "A short description of what this project does and the problem it solves. [Replace me.]", tags: ["React", "Node.js", "MongoDB"], link: "https://github.com/your-username/project-one"},
    {title: "Project Two", desc: "Describe a second project: what you built, and what you learned building it. [Replace me.]", tags: ["Python", "Flask"], link: "https://github.com/your-username/project-two"},
    {title: "Project Three", desc: "A third project, perhaps a team or hackathon build. [Replace me.]", tags: ["JavaScript", "API"], link: "https://github.com/your-username/project-three"}
  ],
  social: [
    {label: "GitHub", url: "https://github.com/your-username"},
    {label: "LinkedIn", url: "https://www.linkedin.com/in/your-username"},
    {label: "Instagram", url: "https://www.instagram.com/your-username"}
  ],
  email: "yourname@example.com",
  phone: "+91 00000 00000"
};
/* ================================================ */

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ext = 'target="_blank" rel="noopener noreferrer"';
const sections = [["about","About"],["skills","Skills"],["projects","Projects"],["contact","Contact"]];

const Navbar = () => `
<header class="nav"><div class="wrap">
  <a class="logo" href="#top" aria-label="${esc(DATA.name)} ${esc(DATA.version)}, back to top">${esc(DATA.name)}<span>${esc(DATA.version)}</span></a>
  <nav aria-label="Main">
    <ul class="links" id="nav-links">
      ${sections.map(([id, t]) => `<li><a href="#${id}">${t}</a></li>`).join("")}
      <li><button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle light and dark theme">Theme</button></li>
    </ul>
  </nav>
  <button class="icon-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">Menu</button>
</div></header>`;

const Hero = () => `
<section class="hero" id="top" aria-labelledby="hero-title"><div class="wrap">
  <p class="role">${esc(DATA.role)}</p>
  <h1 id="hero-title">${esc(DATA.name)}<sup>${esc(DATA.version)}</sup></h1>
  <svg class="bolt" viewBox="0 0 560 40" aria-hidden="true" focusable="false"><path d="M0 22 L70 22 L95 6 L120 34 L150 12 L175 26 L230 26 L255 10 L282 32 L310 18 L560 18"/></svg>
  <p class="lead">${esc(DATA.tagline)}</p>
  <div class="btns"><a class="btn primary" href="#projects">See my projects</a><a class="btn ghost" href="#contact">Get in touch</a></div>
</div></section>`;

const About = () => `
<section class="block" id="about" aria-labelledby="about-h"><div class="wrap split">
  <h2 id="about-h">About me</h2>
  <div class="about">
    ${DATA.about.map(p => `<p>${esc(p)}</p>`).join("")}
    <ul class="facts">${DATA.facts.map(([k, v]) => `<li>${esc(k)}: <strong>${esc(v)}</strong></li>`).join("")}</ul>
  </div>
</div></section>`;

const Skills = () => `
<section class="block" id="skills" aria-labelledby="skills-h"><div class="wrap split">
  <h2 id="skills-h">Skills</h2>
  <div>${Object.entries(DATA.skills).map(([g, list]) => `
    <div class="skill-group"><h3>${esc(g)}</h3><ul class="chips">${list.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>`).join("")}
  </div>
</div></section>`;

const Projects = () => `
<section class="block" id="projects" aria-labelledby="projects-h"><div class="wrap split">
  <h2 id="projects-h">Projects</h2>
  <ul class="proj">${DATA.projects.map(p => `
    <li><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
      <div class="tags" aria-label="Technologies used">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
      <a class="more" href="${esc(p.link)}" ${ext}>View ${esc(p.title)} on GitHub<span class="sr" style="position:absolute;left:-9999px"> (opens in a new tab)</span></a></li>`).join("")}
  </ul>
</div></section>`;

const Contact = () => `
<section class="block" id="contact" aria-labelledby="contact-h"><div class="wrap split">
  <h2 id="contact-h">Contact</h2>
  <div>
    <form id="contact-form" novalidate>
      <div><label for="c-name">Your name</label><input id="c-name" name="name" autocomplete="name" required></div>
      <div><label for="c-email">Your email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
      <div><label for="c-msg">Message</label><textarea id="c-msg" name="message" required></textarea></div>
      <div><button class="btn primary" type="submit">Send message</button></div>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>
    <ul class="direct">
      <li>Email: <a href="mailto:${esc(DATA.email)}">${esc(DATA.email)}</a></li>
      <li>Phone: <a href="tel:${esc(DATA.phone.replace(/\s/g, ""))}">${esc(DATA.phone)}</a></li>
    </ul>
  </div>
</div></section>`;

const Footer = () => `
<footer><div class="wrap">
  <p style="margin:0">&copy; ${new Date().getFullYear()} ${esc(DATA.name)} ${esc(DATA.version)}. ${esc(DATA.department)}.</p>
  <ul class="social" aria-label="Social links">${DATA.social.map(s => `<li><a href="${esc(s.url)}" ${ext}>${esc(s.label)}<span style="position:absolute;left:-9999px"> (opens in a new tab)</span></a></li>`).join("")}</ul>
</div></footer>`;

/* Mount components */
const mount = {navbar: Navbar, hero: Hero, about: About, skills: Skills, projects: Projects, contact: Contact, footer: Footer};
Object.entries(mount).forEach(([id, c]) => { document.getElementById(id).innerHTML = c(); });

/* Mobile menu */
const menuBtn = document.getElementById("menu-btn"), links = document.getElementById("nav-links");
const setMenu = open => { links.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", open); };
menuBtn.addEventListener("click", () => setMenu(!links.classList.contains("open")));
links.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && links.classList.contains("open")) { setMenu(false); menuBtn.focus(); } });

/* Theme toggle */
document.getElementById("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});

/* Active nav link */
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) document.querySelectorAll(".links a[href^='#']").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + en.target.id));
}), {rootMargin: "-40% 0px -55% 0px"});
sections.forEach(([id]) => io.observe(document.getElementById(id)));

/* Contact form: validates, then opens the visitor's email app */
document.getElementById("contact-form").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, status = document.getElementById("form-status");
  const bad = [...f.elements].find(el => el.name && (!el.value.trim() || (el.type === "email" && !/^\S+@\S+\.\S+$/.test(el.value))));
  if (bad) { status.textContent = bad.type === "email" ? "Enter a valid email address." : "Fill in the " + bad.name + " field."; bad.focus(); return; }
  const body = `${f.message.value}\n\nFrom: ${f.name.value} (${f.email.value})`;
  location.href = `mailto:${DATA.email}?subject=${encodeURIComponent("Portfolio message from " + f.name.value)}&body=${encodeURIComponent(body)}`;
  status.textContent = "Opening your email app. If nothing opens, email me directly at the address below.";
});
</script>
</body>
</html>
